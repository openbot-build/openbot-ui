name: CI
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      client_version:
        description: Client package version
        required: false
        type: string
permissions:
  contents: read
  packages: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Download prebuilt devenv packages instead of building them.
          extra-conf: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      # Keeps Nix build results in the GitHub Actions cache between runs.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pnpm
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Set registry access
        run: devenv shell -- bash scripts/registry-auth.sh
      - name: Resolve client package version
        if: github.event_name == 'workflow_dispatch' && inputs.client_version != ''
        env:
          CLIENT_VERSION: ${{ inputs.client_version }}
        run: devenv shell -- pnpm client:update "$CLIENT_VERSION"
      - name: Install dependencies
        run: devenv shell -- bash scripts/install.sh
      - name: Build
        run: devenv shell -- pnpm build
      - name: Typecheck
        run: devenv shell -- pnpm typecheck
      - name: Test
        run: devenv shell -- pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-lockfile
          path: |
            pnpm-lock.yaml
            package.json
      - name: Check package versions
        run: devenv shell -- pnpm test:packages
      - name: Pack packages
        run: devenv shell -- pnpm packages:pack
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ github.sha }}
          path: .release/
          include-hidden-files: true
          retention-days: 7

  packages:
    name: Publish npm packages
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-${{ github.sha }}
          path: .release/
      - name: Set registry access
        run: devenv shell -- bash scripts/registry-auth.sh
      - name: Publish checked packages
        run: devenv shell -- pnpm packages:publish
